[tox]
env_list =
    py314
    py315b1

[testenv]
description = Run extracted slide-code examples and type checks
package = editable
commands =
    python -m unittest discover -s tests
    ty check src tests

[testenv:py314]
base_python = python3.14

[testenv:py315b1]
base_python = python3.14
package = skip
allowlist_externals =
    uv
pass_env =
    PYTHON315B1
    DYLD_FRAMEWORK_PATH
set_env =
    UV_PROJECT_ENVIRONMENT = .venv315b1
commands =
    uv run --python {env:PYTHON315B1} python -m unittest discover -s tests
    uv run --python {env:PYTHON315B1} ty check src tests
